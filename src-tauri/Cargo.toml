[package]
name = "cinevault-core"
version = "0.1.3"
description = "CineVault Native Desktop Host & Local AI Narrative Engine"
authors = ["GhostBat101"]
edition = "2021"

[lib]
name = "cinevault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled", "blob"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
scraper = "0.19"
sysinfo = "0.30"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
directories = "5.0"
sha2 = "0.10"
futures-util = "0.3"
urlencoding = "2.1"
