name: Publish SDK to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

# Ensure only one workflow runs at a time per ref to conserve Actions minutes
concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ghostbat101'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Sync Version from version.json
        run: |
          VERSION=$(node -p "require('./version.json').version")
          echo "Synchronizing SDK package version to $VERSION"
          npm --prefix packages/cinevault-sdk version $VERSION --no-git-tag-version --allow-same-version

      - name: Build SDK
        run: npm run build:sdk

      - name: Publish to GitHub Packages
        working-directory: packages/cinevault-sdk
        run: |
          npm publish || echo "Package version already published; skipping duplicate publish."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
