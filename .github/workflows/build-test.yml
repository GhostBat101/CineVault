# Build Test — Private Installer Artifacts
# ─────────────────────────────────────────────────────────────
# WHAT: Manual-dispatch workflow that builds the full Windows NSIS installer
#       and uploads it as a WORKFLOW ARTIFACT (Actions tab -> this run ->
#       Artifacts). Nothing is published to Releases - use this to install and
#       manually QA a build before running the GEMINI.md release protocol.
#
# USAGE: Actions tab -> "Build Test" -> Run workflow -> wait ~15-25 min ->
#        download "CineVault-test-build" artifact -> unzip -> install.

name: Build Test

on:
  workflow_dispatch:

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build NSIS installer artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci --prefer-offline

      # tauri.conf.json's beforeBuildCommand (`npm run build`) runs automatically.
      - name: Build desktop app + installer
        run: npm run tauri build

      - name: Locate build outputs
        shell: pwsh
        run: |
          Write-Host '--- NSIS bundle ---'
          Get-ChildItem src-tauri\target\release\bundle\nsis -ErrorAction SilentlyContinue
          Write-Host '--- Portable exe ---'
          Get-ChildItem src-tauri\target\release\*.exe -ErrorAction SilentlyContinue

      # The version comes from tauri.conf.json (unified source: 0.3.21+).
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineVault-test-build
          retention-days: 30
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/cinevault.exe
