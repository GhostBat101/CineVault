name: Release Windows Desktop App

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--no-version-check'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci --prefer-offline

      - name: Build Desktop Application & Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CineVault ${{ github.ref_name }}'
          releaseBody: 'Standalone Windows Setup Wizard (.exe) compiled with local SQLite and offline AI runtime.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
